    CRM - profiles, contact details, custom fields, loyalty point balances, and
    appointment history. Third parties such as Klaviyo and Extole use this domain's
    `updateClient` mutation to write loyalty and referral state back into Boulevard.
- aid: boulevard:boulevard-admin-appointments-scheduling-api
  name: Boulevard Admin API - Appointments, Staff & Locations
  tags:
  - Appointments
  - Scheduling
  - Staff
  - Locations
  - GraphQL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.joinblvd.com/2020-01/admin-api/overview
  baseURL: https://dashboard.boulevard.io/api/2020-01/admin
  properties:
  - url: https://developers.joinblvd.com/2020-01/admin-api/overview
    type: Documentation
  - url: https://developers.joinblvd.com/2020-01/admin-api/authentication
    type: Documentation
  - url: graphql/boulevard-graphql.md
    type: GraphQL
  - url: graphql/boulevard-schema.graphql
    type: GraphQL
  description: Read and sync appointment, staff, and location data across a business's
    calendar - past, current, and future appointments, professional rosters, and
    the physical/virtual locations services are delivered from. Backs webhook-driven
    integrations that react to APPOINTMENT_CREATED, APPOINTMENT_CONFIRMED, and
    APPOINTMENT_COMPLETED events.
- aid: boulevard:boulevard-admin-memberships-packages-api
  name: Boulevard Admin API - Memberships & Packages
  tags:
  - Memberships
  - Packages
  - Subscriptions
