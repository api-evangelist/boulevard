    type: Documentation
  - url: graphql/boulevard-graphql.md
    type: GraphQL
  - url: graphql/boulevard-schema.graphql
    type: GraphQL
  description: Issue and manage stored-value gift cards, service vouchers, and
    account credit adjustments as a certified payment facilitator. Documented
    mutations include `CreateGiftCard`, `vouchersCreate`, and `createAccountCreditAdjustment`,
    used by referral/loyalty platforms (e.g. Extole) to fulfill rewards directly
    inside a business's Boulevard account.
- aid: boulevard:boulevard-client-booking-cart-api
  name: Boulevard Client API - Booking Cart & Checkout
  tags:
  - Booking
  - Cart
  - Checkout
  - GraphQL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.joinblvd.com/2020-01/client-api/overview
  baseURL: https://dashboard.boulevard.io/api/2020-01/client
  properties:
  - url: https://developers.joinblvd.com/2020-01/client-api/overview
    type: Documentation
  - url: https://developers.joinblvd.com/2020-01/client-api/authentication
    type: Documentation
  - url: https://github.com/Boulevard/book-sdk
    type: SDK
  - url: https://github.com/Boulevard/create-booking-flow
    type: SDK
  - url: graphql/boulevard-graphql.md
    type: GraphQL
  - url: graphql/boulevard-schema.graphql
    type: GraphQL
  description: Build custom, on-brand self-booking experiences on top of a cart
    workflow - create a cart for a location, add a selected purchasable (service)
    item, reserve an available timeslot, attach a tokenized card as the payment
    method, and check out. Confirmed mutations from the official `book-sdk` and
    `promotion-demo` reference clients include `CreateCart`, `AddCartSelectedPurchasableItem`,
    `AddCartCardPaymentMethod`, and `CheckoutCart`.
- aid: boulevard:boulevard-client-catalog-availability-api
  name: Boulevard Client API - Catalog & Availability
  tags:
  - Services
  - Staff
  - Locations
  - Availability
  - GraphQL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.joinblvd.com/2020-01/client-api/overview
  baseURL: https://dashboard.boulevard.io/api/2020-01/client
  properties:
  - url: https://developers.joinblvd.com/2020-01/client-api/overview
    type: Documentation
  - url: https://github.com/Boulevard/book-sdk
    type: SDK
  - url: graphql/boulevard-graphql.md
    type: GraphQL
  - url: graphql/boulevard-schema.graphql
    type: GraphQL
  description: Public-facing catalog reads that power a booking widget before
    a client ever creates a cart - business and location lookup, bookable service
    categories, staff/professional listings, and bookable dates/times for a chosen
    service and location. Mirrors the `book-sdk` modules `Businesses`, `Locations`,
    `Services`, `Staff`, and the cart's `getBookableDates` / `getBookableTimes`
    calls.
- aid: boulevard:boulevard-tokenization-api
  name: Boulevard Tokenization API
  tags:
  - Tokenization
  - PCI Compliance
  - Payments
  - REST
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.joinblvd.com/2020-01/tokenization-api/overview
  baseURL: https://vault.blvd.co
  properties:
  - url: https://developers.joinblvd.com/2020-01/tokenization-api/overview
    type: Documentation
  description: A narrow, non-GraphQL REST endpoint (`POST https://vault.blvd.co/cards/tokenize`,
    confirmed in the public `promotion-demo` reference client's source) used to
    exchange raw card details for a reusable payment token client-side, before
    that token is attached to a cart via the Client API's `AddCartCardPaymentMethod`
    mutation. Keeps merchant integrations out of PCI DSS scope by ensuring card
    numbers never transit the integrator's own servers.
