aid: boulevard
url: https://raw.githubusercontent.com/api-evangelist/boulevard/refs/heads/main/apis.yml
name: Boulevard
kind: company
description: Boulevard is a client experience platform purpose-built for appointment-based
  self-care businesses - hair salons, spas, medspas, barbershops, and nail salons.
  The platform covers self-scheduling, CRM, marketing, payments (as a certified
  PayFac), and reporting. Boulevard exposes its integration surface as GraphQL -
  a Client API for building custom booking experiences and an Admin API for syncing
  business operations data (clients, appointments, staff, locations, memberships,
  gift cards) - plus a separate Tokenization API for PCI-scope-reducing card capture.
  API access is gated to the Enterprise tier and provisioned through a developer
  sandbox (business ID + API key) via the Boulevard Developer Portal.
